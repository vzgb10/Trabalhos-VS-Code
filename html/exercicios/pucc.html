<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oficina de Desenvolvimento Web</title>
</head>
<body>
    <h1>Oficina de Desenvolvimento Web.</h1>
    <p>Preencha seus dados para participar da oficina</p>

    <form>
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome">

        <label for="email">Email:</label>
        <input type="email" id="email" name="email">

        <label for="date">Data da oficina</label>
        <input type="date" id="date" name="date">

        <input type="radio" id="periodo" name="periodo" value="manha">
        <label for="manha">Manhã</label>
        <input type="radio" id="periodo" name="periodo" value="noite">
        <label for="noite">Noite</label>

        <select name="curso" id="curso">
            <option value="html">ADS</option>
            <option value="css">Engenharia de Software</option>
            <option value="javascript">Ciência da Computação</option>
        </select>

        <checkbox id="termos" name="termos">
        <label for="termos">Aceito os termos e condições</label>

        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </form>
</body>
</html>
