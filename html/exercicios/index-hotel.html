<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StayEasy - Solicitação de Reserva</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style-hotel.css">

    <script src="script-hotel.js" defer></script>
</head>

<body class="bg-light">

    <div class="container py-5">

        <div class="card shadow p-4">

            <h2 class="text-center mb-4">StayEasy</h2>
            <p class="text-center text-muted">
                Solicitação de Reserva
            </p>

            <form id="formReserva" novalidate>

                <div class="mb-3">
                    <label for="nome" class="form-label">Nome completo</label>
                    <input type="text" id="nome" class="form-control" required minlength="5">
                    <div id="erroNome" class="invalid-feedback"></div>
                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" id="email" class="form-control" required>
                        <div id="erroEmail" class="invalid-feedback"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="telefone" class="form-label">Telefone</label>
                        <input type="tel" id="telefone" class="form-control" required maxlength="11">
                        <div id="erroTelefone" class="invalid-feedback"></div>
                    </div>

                </div>

                <div class="mb-3">
                    <label for="nascimento" class="form-label">Data de nascimento</label>
                    <input type="date" id="nascimento" class="form-control" required>
                    <div id="erroNascimento" class="invalid-feedback"></div>
                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label for="checkin" class="form-label">Check-in</label>
                        <input type="date" id="checkin" class="form-control" required>
                        <div id="erroCheckin" class="invalid-feedback"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="checkout" class="form-label">Check-out</label>
                        <input type="date" id="checkout" class="form-control" required>
                        <div id="erroCheckout" class="invalid-feedback"></div>
                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label for="hospedes" class="form-label">Quantidade de hóspedes</label>
                        <input type="number" id="hospedes" class="form-control" required min="1" max="5">
                        <div id="erroHospedes" class="invalid-feedback"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="quarto" class="form-label">Tipo de quarto</label>

                        <select id="quarto" class="form-select" required>
                            <option value="">Selecione</option>
                            <option value="Individual">Individual</option>
                            <option value="Duplo">Duplo</option>
                            <option value="Familia">Família</option>
                        </select>

                        <div id="erroQuarto" class="invalid-feedback"></div>
                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label for="senha" class="form-label">Senha</label>
                        <input type="password" id="senha" class="form-control" required minlength="8">
                        <div id="erroSenha" class="invalid-feedback"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="confirmarSenha" class="form-label">Confirmar senha</label>
                        <input type="password" id="confirmarSenha" class="form-control" required>
                        <div id="erroConfirmarSenha" class="invalid-feedback"></div>
                    </div>

                </div>

                <div class="form-check mb-3">
                    <input type="checkbox" id="aceite" class="form-check-input">
                    <label for="aceite" class="form-check-label">
                        Declaro que li e concordo com as condições da reserva.
                    </label>

                    <div id="erroAceite" class="text-danger small"></div>
                </div>

                <button class="btn btn-primary w-100">
                    Solicitar reserva
                </button>

            </form>

        </div>

        <div id="resultado" class="mt-4"></div>

    </div>

</body>

</html>
